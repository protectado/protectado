# Versions exactes installées sur les boîtiers (arbre complet des dépendances d'exécution).
# Les trois chemins d'installation (bootstrap.sh, update.sh, protectado-update.sh)
# installent CE fichier, sans --upgrade : une nouvelle version d'une dépendance n'arrive
# sur le parc que par un commit qui modifie ce lock. Il revient avec le code lors d'un
# rollback, qui le réinstalle.
#
# Ne pas éditer à la main. Ajouter ou changer une dépendance directe dans
# requirements.txt, puis régénérer (Ubuntu Server 24.04 sur Pi : Python 3.12, aarch64) :
#
#   uv pip compile requirements.txt --python-version 3.12 \
#       --python-platform aarch64-unknown-linux-gnu --no-header -o requirements.lock
#
# puis remettre cet en-tête, et faire passer la suite de tests sous Python 3.12 avec ces
# versions avant de publier.

